<!doctype html>
<html><head><meta charset="utf-8"><title>Brand colours</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw { border-radius: 8px; overflow: hidden; border: 1px solid var(--color-border); }
  .sw .chip { height: 96px; display: flex; align-items: flex-end; padding: 12px; }
  .sw .meta { padding: 10px 12px; background: var(--color-bg); }
  .sw .name { font-family: var(--font-heading); font-size: 14px; font-weight: 600; color: var(--color-text); }
  .sw .hex { font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-text-subtle); margin-top: 2px; }
  .chip-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
</style>
</head><body>
<div class="card-root">
  <div class="swatches">
    <div class="sw">
      <div class="chip" style="background:#0A0A0A; color:#fff;"><span class="chip-label">Foundation</span></div>
      <div class="meta">
        <div class="name">Foundation Black</div>
        <div class="hex">#0A0A0A · neutral-950</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#14B8A6; color:#0A0A0A;"><span class="chip-label">Accent</span></div>
      <div class="meta">
        <div class="name">Brand Teal</div>
        <div class="hex">#14B8A6 · teal-500</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#1E3A8A; color:#fff;"><span class="chip-label">Depth</span></div>
      <div class="meta">
        <div class="name">Brand Navy</div>
        <div class="hex">#1E3A8A · navy-900</div>
      </div>
    </div>
  </div>
</div>
</body></html>
