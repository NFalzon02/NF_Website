<!doctype html>
<html><head><meta charset="utf-8"><title>Badges &amp; tags</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .lbl { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); font-weight: 600; min-width: 70px; }
  .badge {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid transparent;
    line-height: 1.4;
    letter-spacing: 0.02em;
  }
  .b-neutral { background: #F5F5F5; color: #404040; border-color: #E5E5E5; }
  .b-teal { background: #F0FDFA; color: #0F766E; border-color: #CCFBF1; }
  .b-navy { background: #FFF; color: #1E3A8A; border-color: #DBEAFE; }
  .b-success { background: #F0FDF4; color: #15803D; border-color: #BBF7D0; }
  .b-warn { background: #FFFBEB; color: #B45309; border-color: #FDE68A; }
  .b-error { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
  .b-dark { background: #0A0A0A; color: #fff; border-color: #0A0A0A; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; margin-right: 5px; vertical-align: middle; }
</style>
</head><body>
<div class="card-root">
  <div class="row"><span class="lbl">Sport tags</span>
    <span class="badge b-neutral">Football</span>
    <span class="badge b-neutral">Futsal</span>
    <span class="badge b-neutral">Motorsport</span>
    <span class="badge b-neutral">Waterpolo</span>
  </div>
  <div class="row"><span class="lbl">Brand</span>
    <span class="badge b-teal">Press</span>
    <span class="badge b-navy">Editorial</span>
    <span class="badge b-dark">Featured</span>
  </div>
  <div class="row"><span class="lbl">Status</span>
    <span class="badge b-success"><span class="dot" style="background:#16A34A"></span>Delivered</span>
    <span class="badge b-warn"><span class="dot" style="background:#F59E0B"></span>Pending</span>
    <span class="badge b-error"><span class="dot" style="background:#EF4444"></span>Failed</span>
  </div>
</div>
</body></html>
