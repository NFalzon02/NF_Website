<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .btn {
    font-family: var(--font-body);
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(.2,0,0,1), border-color 180ms;
    line-height: 1;
  }
  .btn:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; }
  .btn-primary { background: #0A0A0A; color: #fff; padding: 10px 20px; font-size: 14px; }
  .btn-primary:hover { background: #262626; }
  .btn-secondary { background: transparent; color: #0A0A0A; border-color: #D4D4D4; padding: 10px 20px; font-size: 14px; }
  .btn-secondary:hover { background: #F5F5F5; }
  .btn-ghost { background: transparent; color: #404040; padding: 10px 20px; font-size: 14px; }
  .btn-ghost:hover { background: #FAFAFA; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn-lg { padding: 14px 28px; font-size: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .lbl { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); font-weight: 600; min-width: 64px; }
</style>
</head><body>
<div class="card-root">
  <div class="stack">
    <div class="row"><span class="lbl">Variants</span>
      <button class="btn btn-primary">Book a shoot</button>
      <button class="btn btn-secondary">View portfolio</button>
      <button class="btn btn-ghost">Cancel</button>
    </div>
    <div class="row"><span class="lbl">Sizes</span>
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>
</div>
</body></html>
