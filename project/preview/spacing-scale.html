<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .scale { display: flex; flex-direction: column; gap: 6px; }
  .item { display: grid; grid-template-columns: 70px 50px 1fr; gap: 12px; align-items: center; }
  .tok { font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-text); }
  .px  { font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-text-subtle); }
  .bar { height: 14px; background: #0A0A0A; border-radius: 2px; }
</style>
</head><body>
<div class="card-root">
  <div class="scale">
    <div class="item"><span class="tok">--space-1</span><span class="px">4px</span><span class="bar" style="width:4px"></span></div>
    <div class="item"><span class="tok">--space-2</span><span class="px">8px</span><span class="bar" style="width:8px"></span></div>
    <div class="item"><span class="tok">--space-3</span><span class="px">12px</span><span class="bar" style="width:12px"></span></div>
    <div class="item"><span class="tok">--space-4</span><span class="px">16px</span><span class="bar" style="width:16px"></span></div>
    <div class="item"><span class="tok">--space-6</span><span class="px">24px</span><span class="bar" style="width:24px"></span></div>
    <div class="item"><span class="tok">--space-8</span><span class="px">32px</span><span class="bar" style="width:32px"></span></div>
    <div class="item"><span class="tok">--space-12</span><span class="px">48px</span><span class="bar" style="width:48px"></span></div>
    <div class="item"><span class="tok">--space-16</span><span class="px">64px</span><span class="bar" style="width:64px"></span></div>
    <div class="item"><span class="tok">--space-24</span><span class="px">96px</span><span class="bar" style="width:96px"></span></div>
  </div>
</div>
</body></html>
