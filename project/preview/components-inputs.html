<!doctype html>
<html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 500; color: var(--color-text-muted); letter-spacing: 0.02em; }
  .field input, .field select, .field textarea {
    font-family: var(--font-body);
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 6px;
    border: 1px solid #D4D4D4;
    background: #fff;
    color: #171717;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid #0F766E; outline-offset: 2px; border-color: #A3A3A3; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .help { font-size: 11px; color: var(--color-text-subtle); }
  .err { color: #DC2626; }
  .field.is-error input { border-color: #DC2626; }
</style>
</head><body>
<div class="card-root">
  <div class="grid">
    <div class="field">
      <label for="n">Club / federation</label>
      <input id="n" type="text" placeholder="Floriana FC">
    </div>
    <div class="field">
      <label for="s">Sport</label>
      <select id="s"><option>Football</option><option>Futsal</option><option>Motorsport</option><option>Waterpolo</option></select>
    </div>
    <div class="field">
      <label for="d">Match date</label>
      <input id="d" type="text" placeholder="Sat · 14 Mar · 19:00" value="Sat · 14 Mar · 19:00">
    </div>
    <div class="field is-error">
      <label for="e">Email</label>
      <input id="e" type="email" value="not-an-email">
      <span class="help err">Enter a valid email.</span>
    </div>
  </div>
</div>
</body></html>
