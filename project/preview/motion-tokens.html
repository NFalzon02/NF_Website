<!doctype html>
<html><head><meta charset="utf-8"><title>Motion tokens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { border: 1px solid var(--color-border); border-radius: 8px; padding: 14px; }
  .panel h4 { font-family: var(--font-heading); font-size: 12px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); }
  .row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px dashed var(--color-border); }
  .row:last-child { border-bottom: none; }
  .row code { font-family: ui-monospace, monospace; color: var(--color-text); }
  .row span { color: var(--color-text-subtle); font-family: ui-monospace, monospace; }
  .ban { margin-top: 10px; font-size: 11px; color: var(--color-text-muted); padding: 8px 10px; background: var(--color-bg-subtle); border-radius: 6px; }
  .ban b { color: var(--color-text); }
</style>
</head><body>
<div class="card-root">
  <div class="grid">
    <div class="panel">
      <h4>Duration</h4>
      <div class="row"><code>--duration-fast</code><span>120ms</span></div>
      <div class="row"><code>--duration-base</code><span>180ms</span></div>
      <div class="row"><code>--duration-slow</code><span>280ms</span></div>
    </div>
    <div class="panel">
      <h4>Easing</h4>
      <div class="row"><code>--ease-standard</code><span>cubic-bezier(.2, 0, 0, 1)</span></div>
      <div class="row" style="border:none"><code>(no others)</code><span>—</span></div>
    </div>
  </div>
  <div class="ban"><b>Photojournalist brands don't bounce.</b> No spring, no scale, no upward translate. Opacity and background-colour only.</div>
</div>
</body></html>
