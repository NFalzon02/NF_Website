<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .ramp { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .step { aspect-ratio: 1 / 1.2; border-radius: 6px; border: 1px solid var(--color-border); position: relative; overflow: hidden; }
  .step .num { position: absolute; bottom: 4px; left: 6px; font-size: 10px; font-family: ui-monospace, monospace; }
  .step.dark .num { color: #fff; }
  .step.light .num { color: #0A0A0A; }
</style>
</head><body>
<div class="card-root">
  <div class="ramp">
    <div class="step light" style="background:#FAFAFA"><span class="num">50</span></div>
    <div class="step light" style="background:#F5F5F5"><span class="num">100</span></div>
    <div class="step light" style="background:#E5E5E5"><span class="num">200</span></div>
    <div class="step light" style="background:#D4D4D4"><span class="num">300</span></div>
    <div class="step light" style="background:#A3A3A3"><span class="num">400</span></div>
    <div class="step dark" style="background:#737373"><span class="num">500</span></div>
    <div class="step dark" style="background:#525252"><span class="num">600</span></div>
    <div class="step dark" style="background:#404040"><span class="num">700</span></div>
    <div class="step dark" style="background:#262626"><span class="num">800</span></div>
    <div class="step dark" style="background:#171717"><span class="num">900</span></div>
    <div class="step dark" style="background:#0A0A0A"><span class="num">950</span></div>
  </div>
  <div class="note">Neutral ramp · neutral-50 → neutral-950 · 11 steps</div>
</div>
</body></html>
