<!doctype html>
<html><head><meta charset="utf-8"><title>Eyebrow pattern</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; background: #fff; }
  .eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.075em;
    text-transform: uppercase;
    color: #0F766E;
    display: block;
    margin-bottom: 10px;
  }
  .heading {
    font-family: var(--font-heading);
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.1;
    margin: 0;
    color: #1E3A8A;
  }
  .lead {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    color: #404040;
    margin: 12px 0 0;
    max-width: 56ch;
  }
  .anatomy { display: flex; gap: 24px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--color-text-subtle); margin-top: 14px; }
</style>
</head><body>
<div class="card-root">
  <div>
    <span class="eyebrow">Press · Waterpolo</span>
    <h2 class="heading">Behind the lane line.</h2>
    <p class="lead">A season covering Maltese waterpolo on a journalist's timeline.</p>
  </div>
  <div class="anatomy">
    <span>1 · Eyebrow (caption / tracked / teal)</span>
    <span>2 · Heading (navy editorial)</span>
    <span>3 · Lead</span>
  </div>
</div>
</body></html>
