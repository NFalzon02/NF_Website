<!doctype html>
<html><head><meta charset="utf-8"><title>Radii &amp; borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .swatch { width: 70px; height: 70px; border: 1px solid var(--color-border); background: var(--color-bg); }
  .name { font-family: var(--font-heading); font-size: 12px; font-weight: 600; color: var(--color-text); }
  .v { font-family: ui-monospace, monospace; font-size: 10px; color: var(--color-text-subtle); }
  .use { font-size: 10px; color: var(--color-text-muted); }
</style>
</head><body>
<div class="card-root">
  <div class="grid">
    <div class="item">
      <div class="swatch" style="border-radius:0"></div>
      <div class="name">none</div><div class="v">0</div><div class="use">Tables, dividers</div>
    </div>
    <div class="item">
      <div class="swatch" style="border-radius:4px"></div>
      <div class="name">sm</div><div class="v">4px</div><div class="use">Chips, tags</div>
    </div>
    <div class="item">
      <div class="swatch" style="border-radius:6px"></div>
      <div class="name">button</div><div class="v">6px</div><div class="use">Buttons, inputs</div>
    </div>
    <div class="item">
      <div class="swatch" style="border-radius:8px"></div>
      <div class="name">card</div><div class="v">8px</div><div class="use">Cards, modals</div>
    </div>
    <div class="item">
      <div class="swatch" style="border-radius:999px"></div>
      <div class="name">pill</div><div class="v">999px</div><div class="use">Avatars only</div>
    </div>
  </div>
  <div class="note">No drop shadows anywhere. Elevation is communicated by border + background contrast.</div>
</div>
</body></html>
