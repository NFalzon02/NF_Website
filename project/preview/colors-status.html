<!doctype html>
<html><head><meta charset="utf-8"><title>Status colours</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .item { border: 1px solid var(--color-border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .dot { width: 24px; height: 24px; border-radius: 999px; }
  .name { font-family: var(--font-heading); font-size: 14px; font-weight: 600; color: var(--color-text); }
  .hex { font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-text-subtle); }
  .msg { font-size: 12px; padding: 6px 10px; border-radius: 6px; font-weight: 500; }
</style>
</head><body>
<div class="card-root">
  <div class="grid">
    <div class="item">
      <div class="dot" style="background:#16A34A"></div>
      <div class="name">Success</div>
      <div class="hex">#16A34A · green-600</div>
      <div class="msg" style="background:#F0FDF4; color:#15803D">Gallery delivered</div>
    </div>
    <div class="item">
      <div class="dot" style="background:#F59E0B"></div>
      <div class="name">Warning</div>
      <div class="hex">#F59E0B · amber-500</div>
      <div class="msg" style="background:#FFFBEB; color:#B45309">Awaiting confirmation</div>
    </div>
    <div class="item">
      <div class="dot" style="background:#EF4444"></div>
      <div class="name">Error</div>
      <div class="hex">#EF4444 · rose-500</div>
      <div class="msg" style="background:#FEF2F2; color:#DC2626">Booking failed</div>
    </div>
  </div>
  <div class="note">Reserved for UI feedback only — never used for brand expression.</div>
</div>
</body></html>
