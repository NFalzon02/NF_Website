<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NF Photography</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/nf-logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #0A0A0A; font-family: 'Inter', sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: inherit; }
  ::selection { background: #14B8A6; color: #0A0A0A; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Buttons.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="PortfolioGrid.jsx"></script>
<script type="text/babel" src="EditorialBlock.jsx"></script>
<script type="text/babel" src="FeatureBlock.jsx"></script>
<script type="text/babel" src="PressStrip.jsx"></script>
<script type="text/babel" src="BookingForm.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const [active, setActive] = React.useState('top');

  function navigate(id) {
    setActive(id);
    const el = document.getElementById(id);
    if (el) {
      window.scrollTo({ top: id === 'top' ? 0 : el.offsetTop - 64, behavior: 'smooth' });
    }
  }

  function bookShoot() {
    navigate('contact');
  }

  return (
    <>
      <Header active={active} onNavigate={navigate} onBook={bookShoot} />
      <Hero onBook={bookShoot} onView={() => navigate('work')} />
      <PortfolioGrid />
      <EditorialBlock />
      <FeatureBlock onBook={bookShoot} />
      <PressStrip />
      <BookingForm />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
